<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAP FOURNISSEURS</title>
<style>
:root {
  --blue:#E30613; --blue2:#000000; --light:#F2F2F2; --border:#D9D9D9;
  --text:#000000; --muted:#666666; --green:#F2F2F2; --danger:#b91c1c;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f6f8fb;color:var(--text)}
header{background:var(--blue);color:white;padding:22px 18px}
header h1{margin:0;font-size:26px}
header p{margin:6px 0 0;opacity:.9}
.container{max-width:1200px;margin:0 auto;padding:18px}
.toolbar{display:grid;grid-template-columns:2fr 2fr auto auto;gap:12px;background:white;padding:16px;border-radius:12px;box-shadow:0 1px 4px #0001;position:sticky;top:0;z-index:5}
label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:var(--muted)}
select,input,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:white;font:inherit}
button{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}
.primary{background:var(--blue2);color:white}
.secondary{background:#e9eef4;color:#203040}
.danger{background:#fee2e2;color:var(--danger)}
.stats{margin:14px 0;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}
.card{background:white;border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:0 1px 3px #0000000a}
.card h3{margin:0 0 8px;font-size:19px}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--green);font-size:12px;font-weight:700;margin-bottom:10px}
.contact{border-top:1px solid #edf1f5;padding-top:9px;margin-top:9px}
.contact a{color:#0b63b6;text-decoration:none;font-weight:700}
.muted{color:var(--muted)}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.hidden{display:none!important}
.modal-bg{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal{background:white;border-radius:14px;padding:20px;max-width:760px;width:100%;max-height:90vh;overflow:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal h2{margin-top:0}
.contact-edit{background:#f8fafc;border:1px solid var(--border);padding:12px;border-radius:10px;margin:10px 0}
.footer-note{margin-top:22px;color:var(--muted);font-size:13px}
@media(max-width:760px){
  .toolbar{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
}

.card{position:relative;overflow:hidden}
.card h3{padding-right:82px}
.activity-icon{
  position:absolute;top:12px;right:14px;width:66px;height:66px;
  display:flex;align-items:center;justify-content:center;
}
.activity-icon img,.activity-icon svg{max-width:58px;max-height:58px;display:block}
.activity-icon::after{
  content:"";position:absolute;bottom:0;width:44px;height:3px;background:#E30613;border-radius:3px;
}
.contacts-toggle{
  margin-top:10px;background:#000;color:#fff;border-radius:8px;padding:8px 12px;
}
.contacts-toggle:hover{background:#E30613}
.contacts-drawer{
  margin-top:10px;border-top:1px solid #edf1f5;padding-top:12px;
  animation:fadeIn .15s ease-out;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}
.supplier-brand{
  display:flex;align-items:center;gap:12px;margin-bottom:10px;
  padding:10px;background:#fafafa;border:1px solid var(--border);border-radius:10px;
}
.supplier-logo{
  width:58px;height:58px;object-fit:contain;background:white;border-radius:8px;
  border:1px solid #eee;padding:5px;
}
.logo-fallback{
  width:58px;height:58px;border-radius:8px;background:#000;color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;
}
.brand-name{font-weight:800}
.brand-site{font-size:12px;color:var(--muted);margin-top:3px}
.contact{border-top:1px solid #edf1f5;padding-top:9px;margin-top:9px}
.contact:first-of-type{border-top:0}


/* ===== V4 : pictos activités uniformes + logo fournisseur manuel ===== */
.activity-icon{
  position:absolute;
  top:12px;
  right:14px;
  width:64px;
  height:64px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.activity-icon svg,
.activity-icon img{
  width:54px !important;
  height:54px !important;
  max-width:54px !important;
  max-height:54px !important;
  object-fit:contain;
}
.activity-icon::after{
  content:"";
  position:absolute;
  bottom:0;
  width:40px;
  height:3px;
  background:#E30613;
  border-radius:2px;
}

.supplier-brand{display:none!important}
.supplier-logo{display:none!important}
.logo-fallback{display:none!important}
.brand-name{display:none!important}
.brand-site{display:none!important}

.website-line{
  margin-top:12px;
  padding-top:10px;
  border-top:1px solid #edf1f5;
  font-size:13px;
}
.website-line a{
  color:#E30613;
  font-weight:700;
  text-decoration:none;
}
.website-line a:hover{text-decoration:underline}

.manual-logo-card{
  margin-top:10px;
  display:flex;
  align-items:center;
  gap:10px;
}
.manual-logo-card img{
  width:72px;
  height:48px;
  object-fit:contain;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:7px;
  padding:4px;
}
.logo-upload-row{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}
.logo-preview{
  width:120px;
  height:70px;
  object-fit:contain;
  border:1px solid #d9d9d9;
  border-radius:8px;
  background:#fff;
  padding:5px;
}
.logo-preview-wrap{
  margin-top:8px;
}


.authbar{max-width:1200px;margin:10px auto 0;padding:0 18px;display:flex;justify-content:flex-end;gap:8px;align-items:center;flex-wrap:wrap}
.authbar input{width:210px;background:white}
.authbar button{background:#000;color:#fff}
.authbar .status{color:#fff;font-size:13px}
.sync-status{font-size:12px;color:var(--muted);margin:8px 0}

.badge + .badge{margin-left:6px}
</style>
</head>

<div class="authbar">
  <span id="authStatus" class="status">Consultation publique</span>
  <input id="loginEmail" type="email" placeholder="E-mail">
  <input id="loginPassword" type="password" placeholder="Mot de passe">
  <button id="loginBtn">Connexion</button>
  <button id="logoutBtn" class="hidden">Déconnexion</button>
</div>
</header>

<div class="container">
  <div class="toolbar">
    <div>
      <label for="activitySelect">Activité</label>
      <select id="activitySelect"></select>
    </div>
    <div>
      <label for="searchInput">Recherche</label>
      <input id="searchInput" placeholder="Fournisseur, contact, e-mail…">
    </div>
    <button class="primary" id="addSupplierBtn">+ Fournisseur</button>
    <button class="secondary" id="addActivityBtn">+ Activité</button>
  </div>

  <div class="sync-status" id="syncStatus">Connexion à Supabase…</div><div class="stats" id="stats"></div>
  <div class="cards" id="cards"></div>

function normalizeSupplierName(name=""){return String(name).replace(/\s*\([^)]*\)\s*/g," ").replace(/\s*\/.*$/,"").trim().toUpperCase();}
function domainForSupplier(s){
  if(s.website)return String(s.website).replace(/^https?:\/\//i,"").replace(/^www\./i,"").split("/")[0];

  for(const [k,d] of Object.entries(SUPPLIER_DOMAINS))if(n.includes(k)||k.includes(n))return d;
  return "";
}

function editor(){return !!currentUser;}
function setSync(t,e=false){const x=document.getElementById("syncStatus");x.textContent=t;x.style.color=e?"#b91c1c":"";}

async function loadDB(){
  setSync("Chargement de la base…");
  const [ar,sr,cr]=await Promise.all([
    sb.from("activities").select("id,name").order("name"),
    sb.from("suppliers").select("id,activity_id,name,accord_cadre,catalogue,notes,website,logo_data").order("name"),
    sb.from("contacts").select("id,supplier_id,name,role,email,phone,sort_order").order("sort_order")
  ]);
  const err=ar.error||sr.error||cr.error;
  if(err){console.error(err);setSync("Erreur Supabase : "+err.message,true);return;}
  const acts=ar.data||[], by={};
  for(const c of (cr.data||[]))(by[c.supplier_id]??=[]).push({id:c.id,name:c.name||"",role:c.role||"",email:c.email||"",phone:c.phone||""});
  db.activities=acts;
  db.suppliers=(sr.data||[]).map(s=>({
    id:s.id,activityId:s.activity_id,activity:(acts.find(a=>a.id===s.activity_id)||{}).name||"",
    name:s.name,accordCadre:!!s.accord_cadre,catalogue:s.catalogue||"",notes:s.notes||"",website:s.website||"",logo:s.logo_data||"",contacts:by[s.id]||[]
  }));
  populateActivities();render();setSync("Données synchronisées ✓");
}

function populateActivities(){
  const sel=document.getElementById("activitySelect"),prev=sel.value;
  sel.innerHTML='<option value="">Toutes les activités</option>'+db.activities.map(a=>`<option value="${esc(a.name)}">${esc(a.name)}</option>`).join("");
  if(prev&&db.activities.some(a=>a.name===prev))sel.value=prev;
}

function render(){
  const act=document.getElementById("activitySelect").value,q=document.getElementById("searchInput").value.trim().toLowerCase();
  let list=db.suppliers.filter(s=>!act||s.activity===act);
  if(q)list=list.filter(s=>[s.name,s.activity,s.accordCadre?"oui":"non",s.catalogue,s.notes,s.website||"",...(s.contacts||[]).flatMap(c=>[c.name,c.role,c.email,c.phone])].join(" ").toLowerCase().includes(q));
  document.getElementById("stats").textContent=`${list.length} fournisseur${list.length>1?"s":""}`;
  document.getElementById("addSupplierBtn").style.display=editor()?"":"none";
  document.getElementById("addActivityBtn").style.display=editor()?"":"none";
  const cards=document.getElementById("cards");
  if(!list.length){cards.innerHTML='<div class="card"><strong>Aucun fournisseur trouvé.</strong></div>';return;}
  cards.innerHTML=list.map(s=>{
    const domain=domainForSupplier(s),url=domain?`https://${domain}`:"",count=(s.contacts||[]).length;
    return `<article class="card">
      <div class="activity-icon">${activityIconSVG(s.activity)}</div>
      <h3>${esc(s.name)}</h3><div class="muted">${esc(s.activity)}</div>
      <div class="badge">Accord cadre : ${s.accordCadre ? "Oui" : "Non"}</div>${s.catalogue ? `<div class="badge">Catalogue : ${esc(s.catalogue === "Catalogue interne" ? "Interne" : s.catalogue)}</div>` : ""}
      ${url?`<div class="website-line">Site web : <a href="${esc(url)}" target="_blank" rel="noopener">${esc(domain)} ↗</a></div>`:""}
      ${s.logo?`<div class="manual-logo-card"><img src="${s.logo}" alt="Logo ${esc(s.name)}"></div>`:""}
      <button class="contacts-toggle" onclick="toggleContacts('${s.id}')">Contacts (${count})</button>
      <div id="contacts-${s.id}" class="contacts-drawer hidden">
        ${count?s.contacts.map(c=>`<div class="contact"><strong>${esc(c.name||"Contact")}</strong>${c.role?` — ${esc(c.role)}`:""}<br>${c.email?`<a href="mailto:${esc(c.email)}">${esc(c.email)}</a><br>`:""}${c.phone?`<span>${esc(c.phone)}</span>`:""}</div>`).join(""):'<div class="muted">Aucun contact renseigné</div>'}
      </div>
      ${s.notes?`<p>${esc(s.notes)}</p>`:""}
      ${editor()?`<div class="actions"><button class="secondary" onclick="editSupplier('${s.id}')">Modifier</button><button class="danger" onclick="deleteSupplier('${s.id}')">Supprimer</button></div>`:""}
    </article>`;
  }).join("");
}
window.toggleContacts=id=>{const e=document.getElementById(`contacts-${id}`);if(e)e.classList.toggle("hidden");};

async function addActivity(){
  if(!editor())return;
  const name=prompt("Nom de la nouvelle activité :");if(!name||!name.trim())return;
  const r=await sb.from("activities").insert({name:name.trim()});
  if(r.error)return alert(r.error.message);await loadDB();
}

function supplierModal(supplier=null){
  if(!editor())return;
  const editing=!!supplier,s=supplier?structuredClone(supplier):{id:null,activity:document.getElementById("activitySelect").value||db.activities[0]?.name||"",name:"",accordCadre:false,catalogue:"",notes:"",website:"",logo:"",contacts:[]};
  const root=document.getElementById("modalRoot");
  root.innerHTML=`<div class="modal-bg"><div class="modal">
  <h2>${editing?"Modifier le fournisseur":"Ajouter un fournisseur"}</h2>
  <div class="grid2">
    <div><label>Activité</label><select id="mActivity">${db.activities.map(a=>`<option value="${a.id}" ${a.name===s.activity?"selected":""}>${esc(a.name)}</option>`).join("")}</select></div>
    <div><label>Fournisseur</label><input id="mName" value="${esc(s.name)}"></div>
    <div><label>Accord cadre</label>
      <select id="mAccordCadre">
        <option value="false" ${!s.accordCadre?"selected":""}>Non</option>
        <option value="true" ${s.accordCadre?"selected":""}>Oui</option>
      </select>
    </div>
    <div><label>Catalogue</label>
      <select id="mCatalogue">
        <option value="" ${!s.catalogue?"selected":""}>Aucun</option>
        <option value="Catalogue interne" ${s.catalogue==="Catalogue interne"?"selected":""}>Catalogue interne</option>
        <option value="Punchout" ${s.catalogue==="Punchout"?"selected":""}>Punchout</option>
      </select>
    </div>
    <div><label>Notes / Adresse</label><input id="mNotes" value="${esc(s.notes)}"></div>
    <div><label>Site web / domaine</label><input id="mWebsite" placeholder="ex. rexel.fr" value="${esc(s.website||"")}"></div>
    <div><label>Logo fournisseur</label><input id="mLogoFile" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"><div id="logoPreviewWrap" class="${s.logo?"":"hidden"}"><img id="logoPreview" class="logo-preview" src="${s.logo||""}"></div><button type="button" class="secondary" id="removeLogoBtn">Retirer le logo</button></div>
  </div>
  <h3>Contacts</h3><div id="contactEditor"></div><button class="secondary" id="addContactBtn">+ Ajouter un contact</button>
  <div class="actions" style="justify-content:flex-end"><button class="secondary" id="cancelBtn">Annuler</button><button class="primary" id="saveBtn">Enregistrer</button></div>
  </div></div>`;
  let contacts=(s.contacts||[]).map(c=>({...c})),logoData=s.logo||"";
  function draw(){
    const ce=document.getElementById("contactEditor");
    ce.innerHTML=contacts.map((c,i)=>`<div class="contact-edit"><div class="grid2"><div><label>Nom</label><input data-i="${i}" data-k="name" value="${esc(c.name||"")}"></div><div><label>Fonction / Service</label><input data-i="${i}" data-k="role" value="${esc(c.role||"")}"></div><div><label>E-mail</label><input data-i="${i}" data-k="email" value="${esc(c.email||"")}"></div><div><label>Téléphone</label><input data-i="${i}" data-k="phone" value="${esc(c.phone||"")}"></div></div><button class="danger" onclick="removeContact(${i})">Supprimer ce contact</button></div>`).join("");
    ce.querySelectorAll("input").forEach(x=>x.oninput=e=>contacts[+e.target.dataset.i][e.target.dataset.k]=e.target.value);
  }
  window.removeContact=i=>{contacts.splice(i,1);draw();};draw();
  document.getElementById("addContactBtn").onclick=()=>{contacts.push({name:"",role:"",email:"",phone:""});draw();};
  document.getElementById("cancelBtn").onclick=()=>root.innerHTML="";
  document.getElementById("mLogoFile").onchange=e=>{const f=e.target.files?.[0];if(!f)return;if(f.size>700*1024){alert("Logo limité à 700 ko.");e.target.value="";return;}const rd=new FileReader();rd.onload=()=>{logoData=rd.result;document.getElementById("logoPreview").src=logoData;document.getElementById("logoPreviewWrap").classList.remove("hidden");};rd.readAsDataURL(f);};
  document.getElementById("removeLogoBtn").onclick=()=>{logoData="";document.getElementById("logoPreviewWrap").classList.add("hidden");};
  document.getElementById("saveBtn").onclick=async()=>{
    const name=document.getElementById("mName").value.trim();if(!name)return alert("Nom obligatoire.");
    const payload={activity_id:document.getElementById("mActivity").value,name,accord_cadre:document.getElementById("mAccordCadre").value==="true",catalogue:document.getElementById("mCatalogue").value,notes:document.getElementById("mNotes").value.trim(),website:document.getElementById("mWebsite").value.trim(),logo_data:logoData};
    let id=s.id;
    if(editing){let r=await sb.from("suppliers").update(payload).eq("id",s.id);if(r.error)return alert(r.error.message);r=await sb.from("contacts").delete().eq("supplier_id",s.id);if(r.error)return alert(r.error.message);}
    else{const r=await sb.from("suppliers").insert(payload).select("id").single();if(r.error)return alert(r.error.message);id=r.data.id;}
    const rows=contacts.filter(c=>c.name||c.role||c.email||c.phone).map((c,i)=>({supplier_id:id,name:c.name||"",role:c.role||"",email:c.email||"",phone:c.phone||"",sort_order:i}));
    if(rows.length){const r=await sb.from("contacts").insert(rows);if(r.error)return alert(r.error.message);}
    root.innerHTML="";await loadDB();
  };
}
window.editSupplier=id=>supplierModal(db.suppliers.find(s=>s.id===id));
window.deleteSupplier=async id=>{if(!editor())return;const s=db.suppliers.find(x=>x.id===id);if(!confirm(`Supprimer ${s.name} ?`))return;const r=await sb.from("suppliers").delete().eq("id",id);if(r.error)return alert(r.error.message);await loadDB();};

async function updateAuthUI(){
  const r=await sb.auth.getUser();currentUser=r.data.user||null;
  document.getElementById("authStatus").textContent=currentUser?`Connecté : ${currentUser.email}`:"Consultation publique";
  document.getElementById("loginBtn").classList.toggle("hidden",!!currentUser);
  document.getElementById("logoutBtn").classList.toggle("hidden",!currentUser);
  document.getElementById("loginEmail").classList.toggle("hidden",!!currentUser);
  document.getElementById("loginPassword").classList.toggle("hidden",!!currentUser);
  render();
}
document.getElementById("loginBtn").onclick=async()=>{const email=document.getElementById("loginEmail").value.trim(),password=document.getElementById("loginPassword").value;if(!email||!password)return alert("E-mail et mot de passe requis.");const r=await sb.auth.signInWithPassword({email,password});if(r.error)return alert(r.error.message);await updateAuthUI();await loadDB();};
document.getElementById("logoutBtn").onclick=async()=>{await sb.auth.signOut();await updateAuthUI();};
document.getElementById("activitySelect").onchange=render;
document.getElementById("searchInput").oninput=render;
document.getElementById("addSupplierBtn").onclick=()=>supplierModal();
document.getElementById("addActivityBtn").onclick=addActivity;
(async()=>{await updateAuthUI();await loadDB();})();
</script>
